[project]
name = "fact-automation"
version = "2.0.0"
description = "Reusable Windows desktop-automation foundation (wizard, AI GUI planning, UIA, execution, state, safety) for FACT ERP.NG."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "pillow>=10.0",
    "pywin32>=306",
    "comtypes>=1.2",
    "pywinauto>=0.6.8",
    "pyperclip>=1.8",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
